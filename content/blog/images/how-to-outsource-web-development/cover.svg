<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="A three layer cost stack. Only the build layer is ever quoted. Coordination and exit cost sit below the quote line and are usually larger.">
  <rect width="1200" height="630" fill="#000000"/>

  <text x="72" y="96" font-family="Urbanist" font-weight="700" font-size="42" fill="#FFFFFF">You are only quoted the top layer</text>
  <text x="72" y="134" font-family="Urbanist" font-weight="400" font-size="20" fill="#8A8A8A">Three costs. One of them appears on the invoice.</text>

  <!-- quoted layer -->
  <rect x="72" y="186" width="640" height="86" rx="10" fill="#101010" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="104" y="222" font-family="Urbanist" font-weight="700" font-size="21" fill="#FFFFFF">The build</text>
  <text x="104" y="250" font-family="Urbanist" font-weight="400" font-size="16" fill="#8A8A8A">Scoped, priced, on the proposal</text>
  <text x="680" y="238" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#CCCCCC">QUOTED</text>

  <!-- the quote line -->
  <line x1="72" y1="292" x2="1128" y2="292" stroke="#02A1E1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1128" y="284" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#02A1E1">the quote line</text>

  <!-- unquoted layers, wider to show they are larger -->
  <rect x="72" y="312" width="880" height="86" rx="10" fill="#101010" stroke="#02A1E1" stroke-width="1.5"/>
  <text x="104" y="348" font-family="Urbanist" font-weight="700" font-size="21" fill="#02A1E1">Coordination</text>
  <text x="104" y="376" font-family="Urbanist" font-weight="400" font-size="16" fill="#CCCCCC">Your hours. Briefing, review, chasing. Usually the larger number.</text>
  <text x="920" y="364" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#02A1E1">NOT QUOTED</text>

  <rect x="72" y="418" width="1056" height="86" rx="10" fill="#101010" stroke="#02A1E1" stroke-width="1.5"/>
  <text x="104" y="454" font-family="Urbanist" font-weight="700" font-size="21" fill="#02A1E1">Exit cost</text>
  <text x="104" y="482" font-family="Urbanist" font-weight="400" font-size="16" fill="#CCCCCC">What it takes to leave. Credentials, documentation, whoever picks it up next.</text>
  <text x="1096" y="470" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#02A1E1">NOT QUOTED</text>

  <line x1="72" y1="546" x2="1128" y2="546" stroke="#5A5A5A" stroke-width="1" opacity="0.4"/>
  <text x="72" y="584" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8A8A8A">93 contracts / 715 hours / $215 average job value</text>
</svg>
