<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="The hybrid that ships: a deterministic pipeline with one agent-shaped step in the middle, bounded by a schema on the way in and a validation gate on the way out.">
  <rect width="1200" height="800" fill="#02040A"/>

  <text x="72" y="88" font-family="Urbanist" font-weight="700" font-size="36" fill="#F1F5F9">The hybrid that actually ships</text>
  <text x="72" y="124" font-family="Urbanist" font-weight="400" font-size="19" fill="#94A3B8">Deterministic on both ends. One judgement step in the middle, fenced.</text>

  <rect x="72" y="204" width="216" height="112" rx="12" fill="#0B0F17" stroke="#64748B" stroke-width="1.5"/>
  <text x="180" y="244" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#94A3B8" letter-spacing="1.5">FIXED</text>
  <text x="180" y="278" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="20" fill="#F1F5F9">Intake</text>
  <text x="180" y="302" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#94A3B8">you wrote this</text>

  <line x1="288" y1="260" x2="336" y2="260" stroke="#64748B" stroke-width="2"/>

  <rect x="336" y="176" width="528" height="168" rx="14" fill="#0B0F17" stroke="#A6DAFF" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#A6DAFF" letter-spacing="1.5">THE ONE AGENT-SHAPED STEP</text>
  <text x="600" y="248" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="22" fill="#A6DAFF">Read it and decide</text>
  <text x="600" y="284" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="17" fill="#CBD5E1">The only part that genuinely needs to</text>
  <text x="600" y="308" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="17" fill="#CBD5E1">look at content and choose.</text>
  <text x="600" y="332" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#94A3B8">Everything around it stays deterministic.</text>

  <line x1="864" y1="260" x2="912" y2="260" stroke="#64748B" stroke-width="2"/>

  <rect x="912" y="204" width="216" height="112" rx="12" fill="#0B0F17" stroke="#64748B" stroke-width="1.5"/>
  <text x="1020" y="244" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#94A3B8" letter-spacing="1.5">FIXED</text>
  <text x="1020" y="278" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="20" fill="#F1F5F9">Deliver</text>
  <text x="1020" y="302" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#94A3B8">you wrote this too</text>

  <rect x="336" y="392" width="252" height="140" rx="12" fill="#0B0F17" stroke="#64748B" stroke-width="1.5"/>
  <text x="462" y="428" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#94A3B8" letter-spacing="1.5">FENCE IN</text>
  <text x="462" y="462" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="19" fill="#F1F5F9">A schema</text>
  <text x="462" y="490" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#CBD5E1">It cannot receive shapes</text>
  <text x="462" y="510" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#CBD5E1">you did not expect</text>

  <rect x="612" y="392" width="252" height="140" rx="12" fill="#0B0F17" stroke="#64748B" stroke-width="1.5"/>
  <text x="738" y="428" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#94A3B8" letter-spacing="1.5">FENCE OUT</text>
  <text x="738" y="462" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="19" fill="#F1F5F9">A validation gate</text>
  <text x="738" y="490" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#CBD5E1">Nothing leaves that the</text>
  <text x="738" y="510" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="16" fill="#CBD5E1">next step cannot consume</text>

  <line x1="462" y1="344" x2="462" y2="392" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="738" y1="344" x2="738" y2="392" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="72" y="564" width="1056" height="118" rx="12" fill="#0B0F17" stroke="#64748B" stroke-width="1"/>
  <text x="112" y="604" font-family="Urbanist" font-weight="700" font-size="20" fill="#F1F5F9">Why this is the shape that survives</text>
  <text x="112" y="636" font-family="Urbanist" font-weight="400" font-size="17" fill="#CBD5E1">The blast radius of a wrong decision is one step wide instead of the whole run. You keep judgement</text>
  <text x="112" y="662" font-family="Urbanist" font-weight="400" font-size="17" fill="#CBD5E1">where judgement is genuinely needed, and you keep auditability everywhere else.</text>

  <line x1="72" y1="722" x2="1128" y2="722" stroke="#64748B" stroke-width="1" opacity="0.4"/>
  <text x="72" y="762" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#94A3B8">nearly every agent I have put into production looks like this</text>
</svg>
