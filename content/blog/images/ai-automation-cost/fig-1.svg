<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="Four pricing models for automation work: fixed price, hourly, monthly retainer and outcome based. Fixed price suits a first engagement because it forces scoping before money moves.">
  <rect width="1200" height="800" fill="#000000"/>

  <text x="72" y="88" font-family="Urbanist" font-weight="700" font-size="36" fill="#FFFFFF">Four pricing models, and what each hides</text>
  <text x="72" y="124" font-family="Urbanist" font-weight="400" font-size="19" fill="#8A8A8A">They suit different situations. Only one is right for a first engagement.</text>

  <!-- header row -->
  <text x="104" y="186" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#8A8A8A" letter-spacing="1.5">MODEL</text>
  <text x="440" y="186" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#8A8A8A" letter-spacing="1.5">SUITS</text>
  <text x="784" y="186" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#8A8A8A" letter-spacing="1.5">WATCH FOR</text>
  <line x1="72" y1="200" x2="1128" y2="200" stroke="#5A5A5A" stroke-width="1"/>

  <!-- row 1, accented: the right default -->
  <rect x="72" y="212" width="1056" height="108" rx="10" fill="#101010" stroke="#02A1E1" stroke-width="2"/>
  <text x="104" y="250" font-family="Urbanist" font-weight="700" font-size="21" fill="#02A1E1">Fixed price</text>
  <text x="104" y="280" font-family="Urbanist" font-weight="400" font-size="16" fill="#CCCCCC">Right for a first engagement</text>
  <text x="440" y="256" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">Known scope, a defined</text>
  <text x="440" y="280" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">deliverable</text>
  <text x="784" y="256" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">Change requests quietly</text>
  <text x="784" y="280" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">priced as new work</text>

  <!-- row 2 -->
  <rect x="72" y="332" width="1056" height="108" rx="10" fill="#101010" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="104" y="370" font-family="Urbanist" font-weight="700" font-size="21" fill="#FFFFFF">Hourly</text>
  <text x="440" y="376" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">Genuinely exploratory work</text>
  <text x="784" y="364" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">No ceiling, and no</text>
  <text x="784" y="388" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">incentive to finish</text>

  <!-- row 3 -->
  <rect x="72" y="452" width="1056" height="108" rx="10" fill="#101010" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="104" y="490" font-family="Urbanist" font-weight="700" font-size="21" fill="#FFFFFF">Monthly retainer</text>
  <text x="104" y="520" font-family="Urbanist" font-weight="400" font-size="16" fill="#8A8A8A">After the first build</text>
  <text x="440" y="496" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">Operating and iterating on</text>
  <text x="440" y="520" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">something already built</text>
  <text x="784" y="496" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">Paying for availability</text>
  <text x="784" y="520" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">you do not use</text>

  <!-- row 4 -->
  <rect x="72" y="572" width="1056" height="108" rx="10" fill="#101010" stroke="#5A5A5A" stroke-width="1.5"/>
  <text x="104" y="610" font-family="Urbanist" font-weight="700" font-size="21" fill="#FFFFFF">Outcome based</text>
  <text x="104" y="640" font-family="Urbanist" font-weight="400" font-size="16" fill="#8A8A8A">Sounds fairest</text>
  <text x="440" y="616" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">Rare. Needs a measurable</text>
  <text x="440" y="640" font-family="Urbanist" font-weight="400" font-size="17" fill="#FFFFFF">baseline that already exists</text>
  <text x="784" y="616" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">Almost nobody was taking</text>
  <text x="784" y="640" font-family="Urbanist" font-weight="400" font-size="17" fill="#CCCCCC">the measurement before</text>

  <line x1="72" y1="716" x2="1128" y2="716" stroke="#5A5A5A" stroke-width="1" opacity="0.4"/>
  <text x="72" y="754" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8A8A8A">fixed price forces the scoping conversation to happen before money moves</text>
</svg>
