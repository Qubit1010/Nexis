<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="A score bar from zero to one hundred percent with a dead zone around fifty percent. Four different causes all produce a reading near fifty, so the number alone cannot tell them apart.">
  <rect width="1200" height="630" fill="#000000"/>

  <text x="72" y="96" font-family="Urbanist" font-weight="700" font-size="42" fill="#FFFFFF">The reading that means nothing</text>
  <text x="72" y="134" font-family="Urbanist" font-weight="400" font-size="20" fill="#8A8A8A">On a pass-or-fail test, four different causes all land in the same place</text>

  <!-- scale -->
  <rect x="72" y="228" width="1056" height="54" rx="8" fill="#101010" stroke="#5A5A5A" stroke-width="1.5"/>

  <!-- the dead zone, the accent subject -->
  <rect x="494" y="228" width="212" height="54" rx="8" fill="#02A1E1" opacity="0.14"/>
  <line x1="600" y1="214" x2="600" y2="296" stroke="#02A1E1" stroke-width="2"/>
  <text x="600" y="204" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#02A1E1">50%</text>
  <text x="600" y="322" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="19" fill="#02A1E1">the noise floor</text>

  <text x="72" y="316" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8A8A8A">0%</text>
  <text x="1128" y="316" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8A8A8A">100%</text>

  <!-- four causes, all pointing into the same band -->
  <line x1="228" y1="424" x2="566" y2="350" stroke="#5A5A5A" stroke-width="1" opacity="0.55"/>
  <line x1="470" y1="424" x2="586" y2="350" stroke="#5A5A5A" stroke-width="1" opacity="0.55"/>
  <line x1="712" y1="424" x2="614" y2="350" stroke="#5A5A5A" stroke-width="1" opacity="0.55"/>
  <line x1="954" y1="424" x2="634" y2="350" stroke="#5A5A5A" stroke-width="1" opacity="0.55"/>

  <rect x="120" y="426" width="216" height="72" rx="9" fill="#101010" stroke="#5A5A5A" stroke-width="1"/>
  <text x="228" y="456" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="17" fill="#FFFFFF">Random output</text>
  <text x="228" y="480" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="15" fill="#8A8A8A">a coin, essentially</text>

  <rect x="362" y="426" width="216" height="72" rx="9" fill="#101010" stroke="#5A5A5A" stroke-width="1"/>
  <text x="470" y="456" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="17" fill="#FFFFFF">Broken harness</text>
  <text x="470" y="480" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="15" fill="#8A8A8A">nothing ever ran</text>

  <rect x="604" y="426" width="216" height="72" rx="9" fill="#101010" stroke="#5A5A5A" stroke-width="1"/>
  <text x="712" y="456" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="17" fill="#FFFFFF">Broken grader</text>
  <text x="712" y="480" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="15" fill="#8A8A8A">it ran, scored wrong</text>

  <rect x="846" y="426" width="216" height="72" rx="9" fill="#101010" stroke="#5A5A5A" stroke-width="1"/>
  <text x="954" y="456" text-anchor="middle" font-family="Urbanist" font-weight="700" font-size="17" fill="#FFFFFF">A mediocre agent</text>
  <text x="954" y="480" text-anchor="middle" font-family="Urbanist" font-weight="400" font-size="15" fill="#8A8A8A">the only real result</text>

  <line x1="72" y1="546" x2="1128" y2="546" stroke="#5A5A5A" stroke-width="1" opacity="0.4"/>
  <text x="72" y="584" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#8A8A8A">mine reported ~50% for months. the binary it launched did not exist.</text>
</svg>
