<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusPoint card variations</title><style>@font-face{font-family:Inter;src:url('../../fonts/InterVariable.woff2')}*{box-sizing:border-box}body{margin:0;background:#E8ECEF;color:#071118;font-family:Inter,Arial,sans-serif}main{max-width:1536px;margin:auto;padding:45px 64px}header{padding:0 0 26px}header h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}header p{font-size:15px;margin:0;color:#43535E}.direction{margin:0 0 40px;padding:25px 28px 28px;background:#F8F9FA;border:1px solid #CDD4D8;border-radius:12px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h2{font-size:23px;letter-spacing:-.025em;margin:0}h2 span{font-weight:450;color:#0079AA;margin-right:12px}.heading p{font-size:12px;color:#53616B;margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:25px}figure{margin:0}figcaption{font-size:10px;letter-spacing:.13em;font-weight:600;margin-bottom:10px;color:#53616B}img{display:block;width:100%;height:auto;box-shadow:0 6px 20px #07111818}.direction:last-child{margin-bottom:0}@media(max-width:900px){main{padding:26px 20px}.pair{grid-template-columns:1fr}.heading{display:block}.heading p{margin-top:8px}.direction{padding:22px}header h1{font-size:27px}}</style></head><body><main><header><h1>NexusPoint / Folded Edge refinements</h1><p>More space below the divider. Every QR opens https://nexus-point.co/work.</p></header><section class="direction" id="direction-1"><div class="heading"><h2><span>3A</span> Soft Edge</h2><p>Soft Fold · Conthrax · Nexus blue</p></div><div class="pair"><figure><figcaption>FRONT</figcaption><img src="3a-soft-edge-front.png" alt="Soft Edge front"></figure><figure><figcaption>BACK</figcaption><img src="3a-soft-edge-back.png" alt="Soft Edge back"></figure></div></section><section class="direction" id="direction-2"><div class="heading"><h2><span>3B</span> Layered Fold</h2><p>Soft Fold · Conthrax · Nexus blue</p></div><div class="pair"><figure><figcaption>FRONT</figcaption><img src="3b-layered-fold-front.png" alt="Layered Fold front"></figure><figure><figcaption>BACK</figcaption><img src="3b-layered-fold-back.png" alt="Layered Fold back"></figure></div></section><section class="direction" id="direction-3"><div class="heading"><h2><span>3C</span> Diagonal Wrap</h2><p>Soft Fold · Conthrax · Nexus blue</p></div><div class="pair"><figure><figcaption>FRONT</figcaption><img src="3c-diagonal-wrap-front.png" alt="Diagonal Wrap front"></figure><figure><figcaption>BACK</figcaption><img src="3c-diagonal-wrap-back.png" alt="Diagonal Wrap back"></figure></div></section></main></body></html>
