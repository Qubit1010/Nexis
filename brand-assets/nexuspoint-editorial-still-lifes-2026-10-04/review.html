<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NexusPoint · Editorial still lifes</title>
  <style>
    :root { color-scheme: dark; --blue: #02a1e1; --ink: #f1f1f2; --muted: #929297; --line: #232326; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 1600px; margin: 0 auto; padding: 64px 48px 72px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
    .brand { margin: 0 0 24px; font-size: 12px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: #c7c7cb; }
    .brand::before { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 10px 2px 0; border-radius: 50%; background: var(--blue); }
    h1 { margin: 0; font-size: clamp(28px, 3.3vw, 48px); font-weight: 400; line-height: 1.1; letter-spacing: -.04em; }
    .intro { max-width: 460px; margin: 18px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .edition { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.7; text-align: right; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 24px; padding-top: 36px; }
    figure { margin: 0; min-width: 0; }
    .thumb { display: block; padding: 0; width: 100%; background: #060607; border: 1px solid #1a1a1d; cursor: zoom-in; overflow: hidden; border-radius: 3px; }
    .thumb img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; }
    .thumb:hover { border-color: #56565c; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    figcaption { display: flex; align-items: flex-start; gap: 12px; padding: 13px 1px 0; font-size: 13px; line-height: 1.45; }
    .number { color: #77777c; font-size: 11px; line-height: 1.75; font-variant-numeric: tabular-nums; }
    .label { color: #ccccd0; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); color: #727277; font-size: 12px; line-height: 1.6; }
    dialog { width: 100%; max-width: none; height: 100dvh; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(0, 0, 0, .98); color: var(--ink); }
    dialog::backdrop { background: #000; }
    .viewer { display: flex; flex-direction: column; height: 100%; padding: 20px 28px 24px; }
    .viewer-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 42px; }
    #viewer-count { margin: 0; color: #99999f; font-size: 12px; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 8px; }
    .control { min-width: 42px; height: 38px; padding: 0 14px; border: 1px solid #343439; border-radius: 3px; background: #111114; color: #d6d6db; cursor: pointer; font: inherit; font-size: 13px; }
    .control:hover { background: #222227; }
    .image-stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 20px 0; }
    #viewer-image { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    #viewer-title { margin: 0; font-weight: 400; color: #d5d5d9; font-size: 14px; text-align: center; line-height: 1.5; }
    .viewer-hint { margin: 8px 0 0; font-size: 11px; color: #6e6e74; text-align: center; }
    @media (max-width: 1000px) { main { padding: 44px 28px 52px; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { main { padding: 32px 18px 42px; } header { display: block; padding-bottom: 28px; } .edition { margin-top: 22px; text-align: left; } .brand { margin-bottom: 18px; } .gallery { grid-template-columns: 1fr; gap: 28px; padding-top: 28px; } .viewer { padding: 12px 12px 20px; } .control { min-width: 36px; padding: 0 10px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="brand">NexusPoint</p>
        <h1>Editorial still lifes</h1>
        <p class="intro">Generated assets for review. Select an image to inspect it at full size.</p>
      </div>
      <p class="edition">Nine concepts<br>October 4, 2026</p>
    </header>
    <section class="gallery" aria-label="Nine generated image concepts">
      <figure>
        <button class="thumb" type="button" data-index="0" aria-label="Enlarge image 1: What a systems audit checks"><img src="01-what-a-systems-audit-checks-v2.png" alt="What a systems audit checks" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">01</span><span class="label">What a systems audit checks</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="1" aria-label="Enlarge image 2: Website and CRM, one system"><img src="02-website-and-crm-one-system-v2.png" alt="Website and CRM, one system" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">02</span><span class="label">Website and CRM, one system</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="2" aria-label="Enlarge image 3: The handoff test"><img src="03-the-handoff-test-v2.png" alt="The handoff test" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">03</span><span class="label">The handoff test</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="3" aria-label="Enlarge image 4: Lead form to CRM without losing a row"><img src="04-lead-form-to-crm-without-losing-a-row.png" alt="Lead form to CRM without losing a row" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">04</span><span class="label">Lead form to CRM without losing a row</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="4" aria-label="Enlarge image 5: Signs a task is repeating"><img src="05-signs-a-task-is-repeating.png" alt="Signs a task is repeating" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">05</span><span class="label">Signs a task is repeating</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="5" aria-label="Enlarge image 6: When a rebuild is the wrong fix"><img src="06-when-a-rebuild-is-the-wrong-fix-v2.png" alt="When a rebuild is the wrong fix" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">06</span><span class="label">When a rebuild is the wrong fix</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="6" aria-label="Enlarge image 7: What we hand over"><img src="07-what-we-hand-over.png" alt="What we hand over" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">07</span><span class="label">What we hand over</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="7" aria-label="Enlarge image 8: Reduced motion scroll animation"><img src="08-reduced-motion-scroll-animation.png" alt="Reduced motion scroll animation" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">08</span><span class="label">Reduced motion scroll animation</span></figcaption>
      </figure>
      <figure>
        <button class="thumb" type="button" data-index="8" aria-label="Enlarge image 9: Assistants that answer from your documents"><img src="09-assistants-that-answer-from-your-documents.png" alt="Assistants that answer from your documents" loading="lazy" width="1920" height="1080"></button>
        <figcaption><span class="number">09</span><span class="label">Assistants that answer from your documents</span></figcaption>
      </figure>
    </section>
    <footer><span>Review materials, focal accent, object counts and framing.</span><span>Images 1–3 and 6 show revised versions.</span></footer>
  </main>
  <dialog id="lightbox" aria-labelledby="viewer-title">
    <div class="viewer">
      <div class="viewer-top">
        <p id="viewer-count" aria-live="polite"></p>
        <div class="controls">
          <button class="control" type="button" id="previous" aria-label="Previous image">←</button>
          <button class="control" type="button" id="next" aria-label="Next image">→</button>
          <button class="control" type="button" id="close">Close</button>
        </div>
      </div>
      <div class="image-stage"><img id="viewer-image" alt=""></div>
      <h2 id="viewer-title"></h2>
      <p class="viewer-hint">Use arrow keys to browse. Press Escape to close.</p>
    </div>
  </dialog>
  <script>
    const thumbnails = Array.from(document.querySelectorAll('.thumb'));
    const lightbox = document.getElementById('lightbox');
    const viewerImage = document.getElementById('viewer-image');
    const viewerTitle = document.getElementById('viewer-title');
    const viewerCount = document.getElementById('viewer-count');
    let currentIndex = 0;
    function displayImage(index) {
      currentIndex = (index + thumbnails.length) % thumbnails.length;
      const selected = thumbnails[currentIndex].querySelector('img');
      viewerImage.src = selected.getAttribute('src');
      viewerImage.alt = selected.alt;
      viewerTitle.textContent = selected.alt;
      viewerCount.textContent = String(currentIndex + 1).padStart(2, '0') + ' / 09';
    }
    thumbnails.forEach((button, index) => {
      button.addEventListener('click', () => {
        displayImage(index);
        lightbox.showModal();
      });
    });
    document.getElementById('previous').addEventListener('click', () => displayImage(currentIndex - 1));
    document.getElementById('next').addEventListener('click', () => displayImage(currentIndex + 1));
    document.getElementById('close').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox || event.target.classList.contains('image-stage')) lightbox.close();
    });
    lightbox.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        displayImage(currentIndex + (event.key === 'ArrowRight' ? 1 : -1));
      }
    });
  </script>
</body>
</html>
